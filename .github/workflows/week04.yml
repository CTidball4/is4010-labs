name: Lab 04 - Data structures

on:
  push:
    paths:
      - 'week04/**'
      - '.github/workflows/week04.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'week04/**'
      - '.github/workflows/week04.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: github.repository == 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate starter structure
        run: |
          test -f week04/lab04.md
          test -d week04/tests

  grade:
    if: github.repository != 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Lab 04 grader
        env:
          PYTHONPATH: 'week04'
        run: python -m pytest week04/tests/ -v

