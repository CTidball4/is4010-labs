name: Lab 06 - Object-oriented programming

on:
  push:
    paths:
      - 'week06/**'
      - '.github/workflows/week06.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'week06/**'
      - '.github/workflows/week06.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: github.repository == 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate starter structure
        run: |
          test -f week06/lab06.md
          test -d week06/tests

  grade:
    if: github.repository != 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Lab 06 grader
        env:
          PYTHONPATH: 'week06'
        run: python -m pytest week06/tests/ -v

