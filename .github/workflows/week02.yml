name: Lab 02 - AI-generated Python preview

on:
  push:
    paths:
      - 'week02/**'
      - '.github/workflows/week02.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'week02/**'
      - '.github/workflows/week02.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: github.repository == 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate starter structure
        run: |
          test -f week02/lab02.md
          test -f week02/lab02_prompts.template.md
          test -d week02/tests

  grade:
    if: github.repository != 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Lab 02 grader
        env:
          PYTHONPATH: 'week02'
        run: python -m pytest week02/tests/ -v

