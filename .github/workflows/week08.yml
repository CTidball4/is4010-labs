name: Lab 08 - Weather CLI application

on:
  push:
    paths:
      - 'week08/**'
      - '.github/workflows/week08.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'week08/**'
      - '.github/workflows/week08.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: github.repository == 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate starter structure
        run: |
          test -f week08/lab08.md
          test -d week08/tests

  grade:
    if: github.repository != 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Lab 08 grader
        env:
          PYTHONPATH: '.'
        run: python -m pytest week08/tests/ -v

