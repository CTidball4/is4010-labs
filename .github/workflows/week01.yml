name: Lab 01 - Repository setup

on:
  push:
    paths:
      - 'week01/**'
      - '.github/workflows/week01.yml'
  pull_request:
    paths:
      - 'week01/**'
      - '.github/workflows/week01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: github.repository == 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate starter structure
        run: |
          test -f week01/lab01.md
          test -f week01/student_setup.template.md
          test -f week01/validate_setup.py

  grade:
    if: github.repository != 'bgreenwell/is4010-labs' && github.repository != 'bgreenwell/is4010-labs-solutions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate setup record
        run: python week01/validate_setup.py

  solution-template:
    if: github.repository == 'bgreenwell/is4010-labs-solutions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate instructor structure
        run: test -f week01/student_setup.template.md
